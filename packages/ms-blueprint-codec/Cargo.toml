[package]
name = "ms-blueprint-codec"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared bidirectional Main Sequence native DesignSaveGame (.sav) <-> Canonical Blueprint JSON codec (WASM + native CLI)"

[lib]
name = "ms_blueprint_codec"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ms-blueprint-cli"
path = "src/bin/ms-blueprint-codec.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap"]
wasm = []

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
uesave = "0.7.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
