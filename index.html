<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="《主星序 Main Sequence》的非官方社区工具集合。">
  <title>Main Sequence Workshop</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px; background: #f4f5f2; color: #242a28; font-family: system-ui, sans-serif; }
    main { width: min(720px, 100%); }
    h1 { margin: 0 0 12px; font-size: clamp(28px, 5vw, 44px); font-weight: 650; }
    p { line-height: 1.7; color: #58625e; }
    nav { display: grid; gap: 16px; margin-top: 32px; }
    a { display: block; padding: 24px; border: 1px solid #d7ded9; border-radius: 12px; background: #fff; color: inherit; text-decoration: none; }
    a:hover, a:focus-visible { border-color: #26755d; outline: none; }
    strong { display: block; margin-bottom: 8px; color: #26755d; font-size: 20px; }
    span { color: #58625e; line-height: 1.6; }
    footer { margin-top: 28px; font-size: 14px; }
    footer a { display: inline; padding: 0; border: 0; background: none; color: #26755d; text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>Main Sequence Workshop</h1>
    <p>《主星序 Main Sequence》的非官方社区工具集合。</p>
    <nav aria-label="网页工具">
      <a href="./production-line-balancer/">
        <strong>产线规划配平器</strong>
        <span>从版本化游戏数据计算目标产率所需的输入、配方分支、机器数量和耗电。</span>
      </a>
      <a href="./mall-planner/">
        <strong>总线超市规划器</strong>
        <span>浏览和编辑物品层级、配方依赖、常备目标与隔离分区。</span>
      </a>
    </nav>
    <footer><a href="https://github.com/iotaxw/main-sequence-workshop">公开源码与使用说明</a> · 游戏名称、图标与数据版权归原权利人所有。</footer>
  </main>
</body>
</html>
