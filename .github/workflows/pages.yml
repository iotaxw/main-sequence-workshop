name: Deploy workshop tools to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/production-line-balancer/package-lock.json
      - name: Install balancer dependencies
        working-directory: apps/production-line-balancer
        run: npm ci
      - name: Test balancer
        working-directory: apps/production-line-balancer
        run: npm test
      - name: Build balancer
        working-directory: apps/production-line-balancer
        run: npm run build
      - name: Check mall planner
        working-directory: apps/mall-planner
        run: npm run check
      - name: Build mall planner
        working-directory: apps/mall-planner
        run: npm run build
      - name: Assemble workshop site
        run: cp -R apps/mall-planner/dist apps/production-line-balancer/dist/mall-planner
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/production-line-balancer/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
